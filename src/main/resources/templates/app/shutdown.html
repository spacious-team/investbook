<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Investbook</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #text {
            color: #F55;
            background-color: #222;
            padding: 0.3em;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
<div id="text">
    Investbook закрывается...
</div>
<script>
    const textElement = document.getElementById('text');
    fetch('/app/shutdown', {method: 'POST',})
        .then(response => {
            if (response.ok) {
                textElement.innerHTML = 'Investbook закрыт';
            } else {
                response.json()
                    .then(data => {
                        const msg = data.message || response.status;
                        textElement.innerHTML = 'Ошибка при закрытии: ' + msg;
                    })
                    .catch(() => {
                        textElement.innerHTML = 'Ошибка при закрытии';
                    });
            }
        })
        .catch(error => {
            textElement.innerHTML = 'Ошибка при закрытии: ' + error
        });
</script>
</body>
</html>
