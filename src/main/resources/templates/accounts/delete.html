<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удаление счета</title>
    <link rel="stylesheet" href="/water-light.css"> <!-- https://cdn.jsdelivr.net/npm/water.css@2/out/light.css -->
    <link rel="stylesheet" href="/water-wrapper.css">
    <style>
        input.account {
            width: 250px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
<h1>Удаление счета</h1>
<p>
    Эта операция удалит все данные (сделки, выплаты, движения денежных средств и т.д.) для указанного счета.
    Операция не обратима. Рекомендуется перед удалением сделать <a href="/portfolio-open-format/backup/download">бэкап</a>.
</p>
<form action="#" th:action="@{/accounts/delete}" method="post">
    <label>
        <input type="text" name="account" list="accounts" class="account" placeholder="Счет" required/>
    </label>
    <button type="button" onclick="window.history.back()">Назад</button>
    <button type="submit">Удалить</button>

    <datalist id="accounts">
        <option th:each="account : ${accounts}" th:text="${account}"></option>
    </datalist>
</form>
</body>
</html>
