<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title th:text="${title ?: 'Успешно'}"></title>
    <link rel="stylesheet" href="/water-light.css"> <!-- https://cdn.jsdelivr.net/npm/water.css@2/out/light.css -->
    <link rel="stylesheet" href="/water-wrapper.css">
    <link rel="stylesheet" href="/main.css">
</head>
<body>
<script th:inline="javascript">

    // Файл не может быть скачан из Java приложения. Сайт блокирует такие запросы,
    // вероятно, на уровне установления TLS соединения по опечатку допустимых протоколов.
    // Файл будет скачан браузером c SOURCE_URL и будет передан в приложение на POST_FILE_TO_APP_URL
    const SOURCE_URL = /*[[${requestURL}]]*/ null
    const POST_FILE_TO_APP_URL =  /*[[${returnURL}]]*/  null

    async function fetchAndSend() {
        try {
            console.log('1. Loading...');

            // Загружаем файл как Blob
            const response = await fetch(SOURCE_URL, {
                method: 'GET',
                headers: {
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                }
            });

            if (!response.ok) {
                throw new Error(`Request error: ${response.status} ${response.statusText}`);
            }

            const blob = await response.blob();
            const headers = {
                'Content-Type': response.headers.get('Content-Type'),
                'Content-Length': response.headers.get('Content-Length'),
                'Content-Disposition': response.headers.get('Content-Disposition')
            };
            console.log(`2. Response, size: ${blob.size} bytes, type: ${blob.type}, http headers: ${headers}`);

            // Создаем FormData для отправки
            const formData = new FormData();
            formData.append('statusCode', response.status);
            formData.append('file', blob, 'response.bin');
            formData.append('headers', JSON.stringify(headers));
            formData.append('originalUrl', SOURCE_URL);

            console.log('3. Send to app server...');

            // Отправляем
            const uploadResponse = await fetch(POST_FILE_TO_APP_URL, {
                method: 'POST',
                body: formData
            });

            if (!uploadResponse.ok) {
                throw new Error(`Can't send response to app: ${uploadResponse.status} ${uploadResponse.statusText}`);
            }
            const result = await uploadResponse.json();
            console.log('4. Response:', result);

            // Редиректим или отображаем результат на текущей странице
            const successURL = /*[[${successURL}]]*/ ''
            if (successURL) {
                const params = new URLSearchParams();
                // Добавляем поля из result
                for (const [key, value] of Object.entries(result)) {
                    if (value !== null && value !== undefined) {
                        params.append(key, value.toString());
                    }
                }
                window.location.href = `${successURL}?${params.toString()}`;
            } else {
                const backLink = /*[[${backLink}]]*/ null;
                document.body.innerHTML = `
                    <h1>${result.title}</h1>
                    <p>${result.message}</p>
                    <form action="${backLink ? backLink : '#'}" method="get" class="back">
                        <button ${backLink ? `type="submit"` : `type="button" onclick="window.history.back()"` }>Назад</button>
                        <button type="submit" formaction="/">На главную</button>
                    </form>
                `;
            }

        } catch (error) {
            // Редиректим или отображаем результат на текущей странице
            const errorURL = /*[[${errorURL}]]*/ ''
            if (errorURL) {
                const params = new URLSearchParams();
                params.append("error", error.toString())
                window.location.href = `${errorURL}?${params.toString()}`;
            } else {
                console.error('Error:', error);
                const backLink = /*[[${backLink}]]*/ null;
                document.body.innerHTML = `
                    <h1>Ошибка</h1>
                    <p>${error}</p>
                    <form action="${backLink ? backLink : '#'}" method="get" class="back">
                        <button ${backLink ? `type="submit"` : `type="button" onclick="window.history.back()"` }>Назад</button>
                        <button type="submit" formaction="/">На главную</button>
                    </form>
                `;
            }
        }
    }

    // Запускаем автоматически при загрузке страницы
    fetchAndSend();
</script>

<p>⏳ Загрузка данных...</p>
</body>
</html>
