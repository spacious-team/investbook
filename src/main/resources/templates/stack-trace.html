<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title th:text="${title ?: 'Ошибка'}"></title>
    <link rel="stylesheet" href="/water-light.css"> <!-- https://cdn.jsdelivr.net/npm/water.css@2/out/light.css -->
    <link rel="stylesheet" href="/water-wrapper.css">
    <link rel="stylesheet" href="/main.css">
    <style>
        .details {
            font-size: smaller;
        }
        .stack-trace {
            white-space: pre;
        }
    </style>
</head>
<body>
<h1 th:text="${title ?: 'Ошибка'}"></h1>
<p th:if="${message != null}" th:text="${message}"></p>
<p class="details">Вы можете
    <a href="https://github.com/spacious-team/investbook/issues/new?labels=bug&template=bug_report.md">сообщить</a>
    об ошибке разработчикам или связаться с <a href="https://t.me/+zriyX7tRQOc0MDEy">технической поддержкой</a>
</p>
<p th:if="${stackTrace != null}" th:text="${stackTrace}" class="details stack-trace"></p>
<form th:action="${backLink != null ? backLink : '#'}" method="get" class="back">
    <button th:if="${backLink == null}" type="button" onclick="window.history.back()">Назад</button>
    <button th:if="${backLink != null}" type="submit">Назад</button>
    <button type="submit" formaction="/">На главную</button>
</form>
</body>
</html>
