# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Publish to Docker Hub

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  publish-docker:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '26'
          distribution: 'liberica'
          cache: maven

      - name: Set Short Git Commit Id (SHA)
        run: echo "SHA_SHORT=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Publish
        run: mvn --batch-mode --activate-profiles docker --define no-zip --define no-installer spring-boot:build-image
        env:
          DOCKER_ID: ${{ secrets.DOCKER_ID }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_IMAGE_LATEST_TAG_SUFFIX: ${{ github.ref_name != 'master' && '-dev' || '' }}
          DOCKER_IMAGE_COMMIT_ID_TAG: ${{ env.SHA_SHORT }}
